services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
#    networks:
#      - my-network

  mysql:
    image: mysql:latest
    environment:
      MYSQL_USER: jk
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_PASSWORD: 1234
      MYSQL_DATABASE: dockerdb
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
#    volumes:
#      - mysql-data:/var/lib/mysql
#    networks:
#      - my-network

